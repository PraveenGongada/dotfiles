# yaml-language-server: $schema=https://raw.githubusercontent.com/jesseduffield/lazygit/master/schema/config.json
# cyberdream theme for lazygit
gui:
  border: rounded
  theme:
    activeBorderColor:
      - "#5ef1ff"
      - bold
    inactiveBorderColor:
      - "#7b8496"
    searchingActiveBorderColor:
      - "#ff5ef1"
    optionsTextColor:
      - "#ffffff"
    selectedLineBgColor:
      - "#3c4048"
    cherryPickedCommitBgColor:
      - "#3c4048"
    cherryPickedCommitFgColor:
      - "#ff5ea0"
    unstagedChangesColor:
      - "#ffbd5e"
    defaultFgColor:
      - "#ffffff"
keybinding:
  commits:
    moveDownCommit: <disabled>
    moveUpCommit: <disabled>
    openLogMenu: <disabled>
customCommands:
  - key: <c-h>
    context: global
    description: Herdr pane left
    command: 'if [ -n "$HC_TERMINAL_ID" ]; then herdr-app do pane.go --direction left; fi'
  - key: <c-j>
    context: global
    description: Herdr pane down
    command: 'if [ -n "$HC_TERMINAL_ID" ]; then herdr-app do pane.go --direction down; fi'
  - key: <c-k>
    context: global
    description: Herdr pane up
    command: 'if [ -n "$HC_TERMINAL_ID" ]; then herdr-app do pane.go --direction up; fi'
  - key: <c-l>
    context: global
    description: Herdr pane right
    command: 'if [ -n "$HC_TERMINAL_ID" ]; then herdr-app do pane.go --direction right; fi'
