set -ag terminal-overrides ",xterm-256color:RGB"
set -g default-terminal "tmux-256color"

set -g mouse on
set -g renumber-windows on          # renumber all windows when any window is closed
set -g set-clipboard on             # use system clipboard
set -g escape-time 0                # zero-out escape time delay
set -g base-index 1                 # start indexing windows at 1 instead of 0
set-window-option -g mode-keys vi   # Set Vi Mode

## Bindings 

# Window Management
bind | split-window -h -c "#{pane_current_path}"  # Open current path
bind - split-window -v -c "#{pane_current_path}"  # Open current path

# Reload
unbind r
bind r source-file ~/.config/tmux/tmux.conf       # Refresh config

# Set Prefix
unbind C-b
set -g prefix C-Space                             # bind control-space as prefix

# Vi mode bindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Resizing windows 
bind -r j resize-pane -D 5                       # Move Pane down
bind -r k resize-pane -U 5                       # Move Pane up 
bind -r l resize-pane -R 5                       # Move Pane right
bind -r h resize-pane -L 5                       # Move Pane left
bind -r m resize-pane -Z                         # Maximize current pane

# Reorder windows in the status bar 
bind -r > swap-window -t +1 \; select-window -t +1   # Move window right
bind -r < swap-window -t -1 \; select-window -t -1   # Move window left

# Clear history
bind-key -n C-S-k send-keys -R \; clear-history

# Plugins 
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'          # yank support for tmux

color_bg="#1e1e2e"        # base
color_bg_alt="#20212c "    # surface0
color_fg="#cdd6f4"        # text
color_blue="#104885"      # navy blue
color_grey="#7f849c"      # overlay1
color_border="#45475a"    # surface1
color_red="#f38ba8"       # red
color_yellow="#f9e2af"    # yellow
color_purple="#9148c3"    # purple
color_cyan="#89dceb"      # sky

# Apply Theme
set -g status-style "bg=$color_bg,fg=$color_fg"
set -g status-left-style "bg=$color_bg,fg=$color_blue"
set -g status-right-style "bg=$color_bg,fg=$color_blue"

# Window status colors
set -g window-status-style "bg=default,fg=$color_grey"
set -g window-status-current-style "bg=default,fg=$color_bg,bold"
set -g window-status-activity-style "bg=$color_red,fg=$color_bg"
set -g window-status-bell-style "bg=$color_yellow,fg=$color_bg"

# Pane border colors
set -g pane-border-style "fg=$color_border"
set -g pane-active-border-style "fg=$color_blue"

# Message colors
set -g message-style "bg=$color_blue,fg=$color_bg"
set -g message-command-style "bg=$color_purple,fg=$color_bg"

# Copy mode colors
set -g mode-style "bg=$color_cyan,fg=$color_bg"

# Status bar configuration
set -g status-right-length 100
set -g status-left-length 100
set -g status-left ""

set -g status-right "#[fg=$color_blue,bg=default]#[fg=$color_fg,bg=$color_blue] #[fg=$color_fg,bg=$color_bg_alt] #{session_name}#[fg=$color_bg_alt,bg=default]"

# Space gap between window tablets
set -g window-status-separator " "

# Window status format
set -g window-status-format "#[fg=$color_bg_alt,bg=default]#[fg=$color_fg,bg=$color_bg_alt]#{b:pane_current_path}#{?window_zoomed_flag, 󰁌,} #[fg=$color_bg,bg=$color_grey] #I#[fg=$color_grey,bg=default]#[default]"
set -g window-status-current-format "#[fg=$color_bg_alt,bg=default]#[fg=$color_fg,bg=$color_bg_alt]#{b:pane_current_path}#{?window_zoomed_flag, 󰁌,} #[fg=$color_fg,bg=$color_blue] #I#[fg=$color_blue,bg=default]#[default]"

# Initializes the TMUX plugin manager
run '~/.config/tmux/plugins/tpm/tpm'

# Make the status bar transparent -> place after run
set -g status-bg default
set -g status-style bg=default
